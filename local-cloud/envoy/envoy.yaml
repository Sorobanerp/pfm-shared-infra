static_resources:
  listeners:
    - name: listener_http_edge
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                generate_request_id: true
                preserve_external_request_id: true
                request_id_extension:
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.request_id.uuid.v3.UuidRequestIdConfig
                    use_request_id_for_trace_sampling: true
                route_config:
                  name: pfm_edge_routes
                  request_headers_to_add:
                    - header:
                        key: x-correlation-id
                        value: "%REQ(X-REQUEST-ID)%"
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - header:
                        key: x-pfm-edge-gateway
                        value: "envoy-local-cloud"
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  response_headers_to_add:
                    - header:
                        key: x-correlation-id
                        value: "%REQ(X-REQUEST-ID)%"
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - header:
                        key: x-frame-options
                        value: "DENY"
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - header:
                        key: x-content-type-options
                        value: "nosniff"
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  virtual_hosts:
                    - name: pfm_api_vhost
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/healthz"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"status":"UP","gateway":"pfm-envoy-edge","routing":"/api/v1/* -> bff_go_cluster"}'
                        - match:
                            prefix: "/api/v1/"
                          route:
                            cluster: bff_go_cluster
                            timeout: 15s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,unavailable,cancelled"
                              num_retries: 2
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: bff_go_cluster
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 2048
            max_pending_requests: 2048
            max_requests: 2048
            max_retries: 3
      load_assignment:
        cluster_name: bff_go_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: host.docker.internal
                      port_value: 8081

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
